name: diag-geofabrik (temporary)
on:
  push:
    branches: [diag-geofabrik]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://download.geofabrik.de
          echo "--- index entry"; curl -sS -m 60 $B/index-v1-nogeom.json | python3 -c "import sys,json; [print(json.dumps(f['properties'])) for f in json.load(sys.stdin)['features'] if 'minnesota' in f['properties']['id']]" || true
          echo "--- us listing"; curl -sS -m 60 -o us.html -w '%{http_code}\n' $B/north-america/us/; grep -o 'minnesota[^"<]*' us.html | sort -u | head -20
          echo "--- minnesota page"; curl -sS -m 60 -o mn.html -w '%{http_code}\n' $B/north-america/us/minnesota.html; grep -o 'href="[^"]*\.pbf[^"]*"' mn.html | head
          for u in $B/north-america/us/minnesota-latest.osm.pbf.md5 $B/north-america/us/minnesota-latest-free.shp.zip http://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf $B/north-america/us-midwest-latest.osm.pbf $B/europe/monaco-latest.osm.pbf; do
            printf '%s -> ' "$u"; curl -sS -o /dev/null -I -m 60 --max-redirs 3 -L -w '%{http_code} %{size_download} %{url_effective}\n' "$u" 2>&1 | tail -1; done
          echo "--- bbbike"; curl -sS -o /dev/null -I -m 60 -L -w '%{http_code} %{url_effective}\n' https://download.bbbike.org/osm/bbbike/Minneapolis/Minneapolis.osm.pbf
