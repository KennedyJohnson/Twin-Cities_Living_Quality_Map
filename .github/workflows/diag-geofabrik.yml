name: diag-geofabrik (temporary)
on:
  push:
    branches: [diag-geofabrik]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          p(){ printf '%s -> ' "$1"; curl -sS -o /dev/null -I -m 60 --max-redirs 3 -L -w '%{http_code} %{size_download} %header{content-length} %{url_effective}\n' "$1" 2>&1 | tail -1; }
          p https://download.geofabrik.de/north-america/us/minnesota-260101.osm.pbf
          p "https://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf?x=1"
          echo "--- osm.fr listings"
          for d in extracts/north-america/ extracts/north-america/us/ extracts/north-america/united_states/ extracts/north-america/us-midwest/; do printf '%s ' $d; curl -sS -m 60 -o l.html -w '%{http_code}\n' https://download.openstreetmap.fr/$d; grep -o 'href="[^"]*"' l.html | grep -i -E 'minn|us|united|midwest' | head -8; done
          p https://download.openstreetmap.fr/extracts/north-america/us-midwest/minnesota-latest.osm.pbf
          p https://download.openstreetmap.fr/extracts/north-america/united_states/minnesota-latest.osm.pbf
          echo "--- bbbike list"; curl -sS -m 60 https://download.bbbike.org/osm/bbbike/ | grep -o 'href="[A-Z][^"/]*/"' | grep -i -E 'minn|saint|paul' | head
