name: Refresh Pipeline Data

# Monthly: 08:00 UTC on the 1st. Also runnable manually. Data sources here
# (Census, OSM, CDC, FEMA) barely change week to week, so monthly matches
# core/osm_extract.py's own EXTRACT_MAX_AGE_DAYS=30 re-download cadence -
# no point refreshing more often than the OSM extract itself refreshes.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # start CI on the automated branch and watch it
  pull-requests: write # land the refresh through a PR

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Compute cache key (year-month, so it rotates roughly in step
          with the 30-day OSM extract refresh)
        id: cache-key
        run: echo "yearmonth=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Without this, every scheduled run starts from a totally fresh
      # checkout and pays the full ~80-130min cost of re-downloading the
      # ~285MB Minnesota OSM extract and re-scanning it for every source
      # (schools, groceries, healthcare, restaurants, entertainment,
      # transit, trails, apartment buildings, street network) - see
      # core/osm_extract.py's query cache. Persisting pipeline/core/.cache
      # here means only the first run each month pays that cost; the
      # extract's own mtime-based staleness check (EXTRACT_MAX_AGE_DAYS)
      # still re-downloads and correctly invalidates the query cache
      # whenever it's actually stale, even if this restores an older key.
      - name: Restore OSM extract and query results
        uses: actions/cache/restore@v6
        with:
          path: pipeline/core/.cache
          key: osm-cache-${{ steps.cache-key.outputs.yearmonth }}
          restore-keys: |
            osm-cache-

      - name: Compute health scores (St. Paul + Minneapolis)
        working-directory: pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python build.py

      - name: Export map/trend/affordability data (parallelized)
        working-directory: pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python exports/export_all.py

      - name: Recompute SHAP score drivers (About page)
        working-directory: pipeline
        continue-on-error: true
        run: |
          pip install "shap>=0.44"
          python -m analysis.score_drivers.shap_drivers

      - name: Save score history to Supabase
        working-directory: pipeline
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python exports/export_supabase.py
          python exports/export_houses_supabase.py

      # Saved even if a later step fails, so a retry doesn't redo the ~2 h extract scan.
      - name: Save OSM extract and query results
        if: always()
        uses: actions/cache/save@v6
        with:
          path: pipeline/core/.cache
          key: osm-cache-${{ steps.cache-key.outputs.yearmonth }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Always changes, so every run commits: shows freshness on the site and
          # keeps the repo active so GitHub doesn't disable this cron after 60 days.
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > web/public/data/last_updated.json
          # pipeline/data is gitignored except a couple of tracked CSVs; naming the ignored dir makes
          # `git add` exit 1, so only update files git already tracks there
          git add web/public/data
          git add -u pipeline/data
          git diff --staged --quiet && { echo "No data changes."; exit 0; }
          git commit -m "chore: refresh pipeline data [automated]"
          # main's ruleset requires passing pipeline-tests + frontend-e2e and, on a user-owned repo, blocks
          # direct bot pushes even when those pass. So: push the commit to a temporary branch, run CI
          # there, then land it through a pull request (merging only needs the checks on its head).
          # Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
          branch="automated/refresh-${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$branch"
          trap 'git push origin --delete "$branch" || true' EXIT
          gh workflow run ci.yml --ref "$branch"
          run=""
          for _ in $(seq 1 20); do
            sleep 10
            run=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "CI run for $branch never started"; exit 1; }
          gh run watch "$run" --exit-status --interval 30
          pr=$(gh pr create --base main --head "$branch" \
            --title "chore: refresh pipeline data [automated]" \
            --body "Monthly data refresh from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. CI passed on this commit.")
          # the merge reads the head commit's check results, which can lag the CI run by a few seconds
          for attempt in $(seq 1 10); do
            gh pr merge "$pr" --squash && exit 0 # the EXIT trap deletes the branch
            echo "Merge attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  alert-on-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Data refresh failed (${new Date().toISOString().slice(0,10)})`,
              body: `The monthly refresh failed, so site data is going stale.\n\nRun:${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });
