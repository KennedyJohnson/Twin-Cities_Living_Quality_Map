name: Refresh Pipeline Data

# Twice a month: 1st and 15th at 08:00 UTC. Also runnable manually.
on:
  schedule:
    - cron: '0 8 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Compute health scores (St. Paul + Minneapolis)
        working-directory: pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          STPAUL_CRIME_ID: ${{ secrets.STPAUL_CRIME_ID || '' }}
          STPAUL_PERMITS_ID: ${{ secrets.STPAUL_PERMITS_ID || '' }}
          STPAUL_REQUESTS_ID: ${{ secrets.STPAUL_REQUESTS_ID || '' }}
          STPAUL_HOUSING_ID: ${{ secrets.STPAUL_HOUSING_ID || '' }}
        run: python build.py

      - name: Export point-layer map data
        working-directory: pipeline
        run: python exports/export_points.py

      - name: Export housing affordability data
        working-directory: pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python exports/export_affordability.py

      - name: Export housing affordability time-series data
        working-directory: pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python exports/export_affordability_timeseries.py

      - name: Export crime/permits/requests/housing time-series data
        working-directory: pipeline
        run: python exports/export_timeseries.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/data
          git diff --staged --quiet || git commit -m "chore: refresh pipeline data [automated]"
          git push
