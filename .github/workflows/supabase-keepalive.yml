name: Supabase keepalive

# Supabase pauses free projects after 7 days without activity, which would break the
# map's score-history chart and houses layer between monthly refreshes. A small real
# query every 3 days keeps the project active.
on:
  schedule:
    - cron: '23 14 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SECRET_KEY secrets are not set"; exit 1
          fi
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            "$SUPABASE_URL/rest/v1/refresh_runs?select=run_at&order=run_at.desc&limit=1"

  # GitHub disables cron workflows after 60 days without repo activity. The monthly refresh only
  # commits when it succeeds, so re-enable both crons here (every 3 days) to keep them alive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          for wf in refresh-data.yml supabase-keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  alert-on-failure:
    needs: ping
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Supabase keepalive failed (${new Date().toISOString().slice(0,10)})`,
              body: `The keepalive query failed, so the Supabase project may get paused (score history and houses layer would stop loading). Check the project in the Supabase dashboard and restore it if paused.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });
